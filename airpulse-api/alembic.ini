# Alembic configuration for AirPulse.
# Alembic is the single source of truth for the AirPulse database schema.
# The sqlalchemy.url is intentionally left blank here; it is loaded from settings
# (DATABASE_URL_SYNC) in alembic/env.py so secrets stay in the environment.

[alembic]
script_location = alembic
prepend_sys_path = .
# Use a UTC, sortable revision filename that matches the Supabase migration style.
file_template = %%(year)d%%(month).2d%%(day).2d%%(hour).2d%%(minute).2d_%%(rev)s_%%(slug)s
timezone = UTC

sqlalchemy.url =

[post_write_hooks]

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
